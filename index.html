<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>未來市政策島 - 3D 互動政策城市</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; background: #edddcf; }
    #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
    #loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1.5rem; font-weight: bold; color: #db6a41; background: #fff; padding: 20px 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); z-index: 999; }
    .ui-box { position: absolute; top: 20px; left: 20px; background: rgba(255,255,255,0.9); padding: 15px 25px; border-radius: 16px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); z-index: 10; }
  </style>
</head>
<body>
  <div id="loading">正在載入 3D 政策島...</div>
  <div id="canvas-container"></div>
  <div class="ui-box">
    <h1 style="margin:0; font-size:1.4rem; color:#db6a41;">🏛️ 示範市政策島</h1>
    <p style="margin:5px 0 0; font-size:0.9rem; color:#666;">使用滑鼠左鍵拖曳旋轉視角，滾輪縮放。</p>
  </div>

  <!-- Three.js CDN -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    let scene, camera, renderer, controls;

    init();

    function init() {
      const container = document.getElementById('canvas-container');

      // Scene
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xedddcf);
      scene.fog = new THREE.Fog(0xedddcf, 20, 60);

      // Camera
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(12, 14, 18);

      // Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);

      // Controls
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      // Lights
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xfff1de, 1.5);
      dirLight.position.set(15, 25, 15);
      dirLight.castShadow = true;
      scene.add(dirLight);

      // Create Central Island & City Blocks
      createIsland();

      // Remove Loading
      document.getElementById('loading').style.display = 'none';

      // Resize
      window.addEventListener('resize', onWindowResize);

      // Loop
      renderer.setAnimationLoop(animate);
    }

    function createIsland() {
      // Base Island Hexagon
      const islandGeo = new THREE.CylinderGeometry(5, 4.5, 0.8, 6);
      const islandMat = new THREE.MeshStandardMaterial({ color: 0xe8dac8, roughness: 0.8 });
      const island = new THREE.Mesh(islandGeo, islandMat);
      island.position.y = -0.4;
      scene.add(island);

      // Miniature Buildings
      const colors = [0xdb6a41, 0x58a6a6, 0xf2b5c6, 0x8db86f, 0x3e7c8c];
      for (let i = 0; i < 7; i++) {
        const angle = (i / 7) * Math.PI * 2;
        const r = 2.2;
        const w = 0.8 + Math.random() * 0.5;
        const h = 1.0 + Math.random() * 1.5;
        const d = 0.8 + Math.random() * 0.5;

        const bGeo = new THREE.BoxGeometry(w, h, d);
        const bMat = new THREE.MeshStandardMaterial({ color: colors[i % colors.length], roughness: 0.7 });
        const b = new THREE.Mesh(bGeo, bMat);
        b.position.set(Math.cos(angle) * r, h / 2, Math.sin(angle) * r);
        b.castShadow = true;
        scene.add(b);
      }
    }

    function animate() {
      controls.update();
      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
  </script>
</body>
</html>
